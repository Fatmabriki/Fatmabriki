<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة الإدارة - مدائن</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/workspace/madayn-platform/css/bootstrap-rtl.min.css">
  <link rel="stylesheet" href="/workspace/madayn-platform/css/style.css">
</head>
<body>
  <header id="app-header" data-include="/workspace/madayn-platform/components/navigation.html"></header>
  <main class="container py-4">
    <h3 class="mb-3">لوحة التقارير والتحليلات</h3>
    <div class="row g-3">
      <div class="col-lg-6">
        <div class="card h-100">
          <div class="card-body">
            <h6 class="fw-bold">معدلات إكمال الاستطلاعات</h6>
            <canvas id="chart-completion" height="200"></canvas>
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="card h-100">
          <div class="card-body">
            <h6 class="fw-bold">متوسط تقييم الاستطلاعات</h6>
            <canvas id="chart-ratings" height="200"></canvas>
          </div>
        </div>
      </div>
      <div class="col-12">
        <div class="card h-100">
          <div class="card-body">
            <div class="d-flex align-items-center justify-content-between">
              <h6 class="fw-bold mb-0">مؤشر التفاعل الشهري</h6>
              <div>
                <button class="btn btn-sm btn-primary me-1" onclick="window.print()">تصدير PDF</button>
                <button class="btn btn-sm btn-secondary" id="btn-export-xlsx">تصدير Excel</button>
              </div>
            </div>
            <canvas id="chart-engagement" height="140" class="mt-2"></canvas>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer id="app-footer" data-include="/workspace/madayn-platform/components/footer.html"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/workspace/madayn-platform/js/app.js"></script>
  <script src="/workspace/madayn-platform/js/charts.js"></script>
  <script>
    document.getElementById('btn-export-xlsx').addEventListener('click', ()=>{
      // Very simple CSV export of survey completion counts
      const surveys = MADAYN.api.listSurveys();
      const responses = JSON.parse(localStorage.getItem('madayn_responses')||'[]');
      const rows = [['Survey','Completions']].concat(surveys.map(s=> [s.title, responses.filter(r=> r.surveyId==s.surveyId).length]));
      const csv = rows.map(r=> r.map(x=> '"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download='madayn-report.csv'; a.click(); URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
