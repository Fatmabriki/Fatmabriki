<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة الأخبار - مدائن</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/workspace/madayn-platform/css/bootstrap-rtl.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="/workspace/madayn-platform/css/style.css">
</head>
<body>
  <header id="app-header" data-include="/workspace/madayn-platform/components/navigation.html"></header>
  <main class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h3 class="mb-0">إدارة الأخبار</h3>
      <button id="btn-new" class="btn btn-primary">خبر جديد</button>
    </div>
    <div class="row g-3">
      <div class="col-lg-7">
        <div class="card">
          <div class="card-body">
            <table id="tbl-news" class="table table-striped" style="width:100%">
              <thead><tr><th>#</th><th>العنوان</th><th>النشر</th><th>الإجراءات</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="card">
          <div class="card-body vstack gap-2">
            <input id="n-title" class="form-control" placeholder="عنوان الخبر">
            <textarea id="n-content" class="form-control" rows="6" placeholder="محتوى الخبر"></textarea>
            <input id="n-image" class="form-control" placeholder="رابط الصورة (اختياري)">
            <div class="form-check form-switch">
              <input id="n-pub" class="form-check-input" type="checkbox">
              <label class="form-check-label" for="n-pub">منشور</label>
            </div>
            <div class="hstack gap-2">
              <button id="btn-save" class="btn btn-success">حفظ</button>
              <button id="btn-reset" class="btn btn-outline-secondary">تفريغ</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer id="app-footer" data-include="/workspace/madayn-platform/components/footer.html"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.all.min.js"></script>
  <script src="/workspace/madayn-platform/js/app.js"></script>
  <script>
    const state = { id: null };
    function loadTable(){
      const tbody = document.querySelector('#tbl-news tbody');
      const data = MADAYN.api.listNews();
      tbody.innerHTML = data.map(n=>`<tr><td>${n.newsId}</td><td>${n.title}</td><td>${n.isPublished? 'نعم':'لا'}</td><td>
        <button class='btn btn-sm btn-primary' data-edit='${n.newsId}'>تعديل</button>
      </td></tr>`).join('');
      MADAYN.admin.bindDataTable('#tbl-news');
      tbody.querySelectorAll('[data-edit]').forEach(btn=> btn.addEventListener('click',()=> edit(+btn.dataset.edit)));
    }
    function edit(id){
      const n = JSON.parse(localStorage.getItem('madayn_news')||'[]').find(x=>x.newsId==id);
      if (!n) return;
      state.id = id; document.getElementById('n-title').value = n.title;
      document.getElementById('n-content').value = n.content;
      document.getElementById('n-image').value = n.imageUrl||'';
      document.getElementById('n-pub').checked = !!n.isPublished;
    }
    function reset(){ state.id=null; document.getElementById('n-title').value=''; document.getElementById('n-content').value=''; document.getElementById('n-image').value=''; document.getElementById('n-pub').checked=false; }
    document.getElementById('btn-reset').addEventListener('click', reset);
    document.getElementById('btn-new').addEventListener('click', reset);
    document.getElementById('btn-save').addEventListener('click', ()=>{
      const news = {
        newsId: state.id,
        title: document.getElementById('n-title').value.trim(),
        content: document.getElementById('n-content').value.trim(),
        imageUrl: document.getElementById('n-image').value.trim(),
        createdBy: MADAYN.auth.current()?.userId ?? 1,
        isPublished: document.getElementById('n-pub').checked ? 1 : 0,
        publishedAt: document.getElementById('n-pub').checked ? new Date().toISOString() : null
      };
      if (!news.title || !news.content) return Swal.fire({ icon:'warning', title:'أدخل العنوان والمحتوى' });
      MADAYN.api.saveNews(news); loadTable(); Swal.fire({ icon:'success', title:'تم الحفظ' });
    });
    document.addEventListener('DOMContentLoaded', ()=> loadTable());
  </script>
</body>
</html>
