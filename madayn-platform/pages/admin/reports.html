<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>التقارير - مدائن</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/workspace/madayn-platform/css/bootstrap-rtl.min.css">
  <link rel="stylesheet" href="/workspace/madayn-platform/css/style.css">
</head>
<body>
  <header id="app-header" data-include="/workspace/madayn-platform/components/navigation.html"></header>
  <main class="container py-4">
    <h3 class="mb-3">التقارير</h3>
    <div class="card">
      <div class="card-body">
        <p class="mb-3">قم بتصدير تقارير الاستطلاعات والتقييمات بصيغة CSV.</p>
        <button class="btn btn-primary" id="btn-export-surveys">تصدير إحصاءات الاستطلاعات</button>
        <button class="btn btn-secondary" id="btn-export-ratings">تصدير التقييمات</button>
      </div>
    </div>
  </main>
  <footer id="app-footer" data-include="/workspace/madayn-platform/components/footer.html"></footer>
  <script src="/workspace/madayn-platform/js/app.js"></script>
  <script>
    function toCSV(rows){ return rows.map(r=> r.map(x=> '"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n'); }
    document.getElementById('btn-export-surveys').addEventListener('click', ()=>{
      const surveys = MADAYN.api.listSurveys();
      const responses = JSON.parse(localStorage.getItem('madayn_responses')||'[]');
      const rows = [['Survey','Completions']].concat(surveys.map(s=> [s.title, responses.filter(r=> r.surveyId==s.surveyId).length]));
      const csv = toCSV(rows); const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download='surveys.csv'; a.click(); URL.revokeObjectURL(url);
    });
    document.getElementById('btn-export-ratings').addEventListener('click', ()=>{
      const ratings = JSON.parse(localStorage.getItem('madayn_survey_ratings')||'[]');
      const rows = [['SurveyId','UserId','Rating','Comment','CreatedAt']].concat(ratings.map(r=> [r.surveyId, r.userId||'', r.rating, r.comment||'', r.createdAt]));
      const csv = toCSV(rows); const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download='ratings.csv'; a.click(); URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
