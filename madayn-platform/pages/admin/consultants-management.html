<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة المستشارين - مدائن</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/workspace/madayn-platform/css/bootstrap-rtl.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="/workspace/madayn-platform/css/style.css">
</head>
<body>
  <header id="app-header" data-include="/workspace/madayn-platform/components/navigation.html"></header>
  <main class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h3 class="mb-0">إدارة المستشارين</h3>
      <button id="btn-new" class="btn btn-primary">إضافة</button>
    </div>
    <div class="row g-3">
      <div class="col-lg-7">
        <div class="card">
          <div class="card-body">
            <table id="tbl" class="table table-striped" style="width:100%">
              <thead><tr><th>#</th><th>الاسم</th><th>التخصص</th><th>الحالة</th><th>الإجراءات</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="card">
          <div class="card-body vstack gap-2">
            <input id="c-name" class="form-control" placeholder="الاسم">
            <input id="c-spec" class="form-control" placeholder="التخصص">
            <textarea id="c-desc" class="form-control" rows="5" placeholder="الوصف"></textarea>
            <input id="c-contact" class="form-control" placeholder="بيانات الاتصال">
            <div class="form-check form-switch"><input id="c-active" class="form-check-input" type="checkbox" checked><label class="form-check-label" for="c-active">نشط</label></div>
            <div class="hstack gap-2">
              <button id="btn-save" class="btn btn-success">حفظ</button>
              <button id="btn-reset" class="btn btn-outline-secondary">تفريغ</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer id="app-footer" data-include="/workspace/madayn-platform/components/footer.html"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
  <script src="/workspace/madayn-platform/js/app.js"></script>
  <script>
    const state = { id: null };
    function load(){ const tbody = document.querySelector('#tbl tbody'); const data = MADAYN.api.listConsultants(); tbody.innerHTML = data.map(c=>`<tr><td>${c.consultantId}</td><td>${c.name}</td><td>${c.specialization||''}</td><td>${c.isActive?'نشط':'موقوف'}</td><td><button class='btn btn-sm btn-primary' data-edit='${c.consultantId}'>تعديل</button></td></tr>`).join(''); MADAYN.admin.bindDataTable('#tbl'); tbody.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click',()=> edit(+b.dataset.edit))); }
    function edit(id){ const c = JSON.parse(localStorage.getItem('madayn_consultants')||'[]').find(x=>x.consultantId==id); if (!c) return; state.id=id; document.getElementById('c-name').value=c.name; document.getElementById('c-spec').value=c.specialization||''; document.getElementById('c-desc').value=c.description||''; document.getElementById('c-contact').value=c.contact||''; document.getElementById('c-active').checked=!!c.isActive; }
    function reset(){ state.id=null; document.getElementById('c-name').value=''; document.getElementById('c-spec').value=''; document.getElementById('c-desc').value=''; document.getElementById('c-contact').value=''; document.getElementById('c-active').checked=true; }
    document.getElementById('btn-reset').addEventListener('click', reset);
    document.getElementById('btn-new').addEventListener('click', reset);
    document.getElementById('btn-save').addEventListener('click', ()=>{
      const c = { consultantId: state.id, name: document.getElementById('c-name').value.trim(), specialization: document.getElementById('c-spec').value.trim(), description: document.getElementById('c-desc').value.trim(), contact: document.getElementById('c-contact').value.trim(), isActive: document.getElementById('c-active').checked ? 1 : 0 };
      if (!c.name) return alert('أدخل الاسم');
      MADAYN.api.saveConsultant(c); load(); alert('تم الحفظ');
    });
    document.addEventListener('DOMContentLoaded', load);
  </script>
</body>
</html>
