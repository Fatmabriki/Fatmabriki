<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الملف الشخصي - مدائن</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/workspace/madayn-platform/css/bootstrap-rtl.min.css">
  <link rel="stylesheet" href="/workspace/madayn-platform/css/style.css">
</head>
<body>
  <header id="app-header" data-include="/workspace/madayn-platform/components/navigation.html"></header>
  <main class="container py-4">
    <h3 class="mb-3">الملف الشخصي</h3>
    <div class="card">
      <div class="card-body">
        <div id="profile"></div>
      </div>
    </div>
  </main>
  <footer id="app-footer" data-include="/workspace/madayn-platform/components/footer.html"></footer>
  <script src="/workspace/madayn-platform/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{
      const p = document.getElementById('profile');
      const u = MADAYN.auth.current();
      if (!u) { p.innerHTML = '<div class="text-muted">ضيف - قم <a href="/workspace/madayn-platform/pages/auth/login.html">بتسجيل الدخول</a> للوصول إلى السجل.</div>'; return; }
      const responses = JSON.parse(localStorage.getItem('madayn_responses')||'[]').filter(r=> r.userId==u.userId);
      p.innerHTML = `<div class='mb-2'><strong>الاسم:</strong> ${u.name}</div><div class='mb-2'><strong>البريد:</strong> ${u.email}</div><div><strong>سجل الاستطلاعات:</strong> ${responses.length} مشاركة</div>`;
    });
  </script>
</body>
</html>
