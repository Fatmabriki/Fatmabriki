<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول - مدائن</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/workspace/madayn-platform/css/bootstrap-rtl.min.css">
  <link rel="stylesheet" href="/workspace/madayn-platform/css/style.css">
</head>
<body>
  <main class="container py-5" style="max-width:520px;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="text-center mb-4" style="color: var(--color-primary)">تسجيل الدخول</h4>
        <div class="vstack gap-2">
          <label class="form-label">البريد الإلكتروني</label>
          <input id="email" type="email" class="form-control" placeholder="name@example.com" value="user@madayn.om">
          <label class="form-label">كلمة المرور</label>
          <input id="password" type="password" class="form-control" placeholder="••••••" value="User@123">
          <div class="d-flex align-items-center justify-content-between">
            <a href="/workspace/madayn-platform/pages/auth/forgot-password.html" class="small">نسيت كلمة المرور؟</a>
            <a href="/workspace/madayn-platform/pages/auth/register.html" class="small">مستخدم جديد</a>
          </div>
          <button id="btn-login" class="btn btn-primary mt-2">دخول</button>
          <button id="btn-admin" class="btn btn-secondary">دخول كمسؤول</button>
          <a href="/workspace/madayn-platform/index.html" class="btn btn-outline-secondary">استمرار كضيف</a>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.all.min.js"></script>
  <script src="/workspace/madayn-platform/js/app.js"></script>
  <script>
    document.getElementById('btn-login').addEventListener('click', ()=>{
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const r = MADAYN.auth.login(email, password);
      if (!r.ok) return Swal.fire({ icon:'error', title: r.message });
      Swal.fire({ icon:'success', title:'مرحباً '+r.user.name }).then(()=> location.href = '/workspace/madayn-platform/index.html');
    });
    document.getElementById('btn-admin').addEventListener('click', ()=>{
      const r = MADAYN.auth.login('admin@madayn.om','Admin@123');
      if (r.ok) location.href = '/workspace/madayn-platform/pages/admin/dashboard.html';
    });
  </script>
</body>
</html>
