<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>استعادة كلمة المرور - مدائن</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/workspace/madayn-platform/css/bootstrap-rtl.min.css">
  <link rel="stylesheet" href="/workspace/madayn-platform/css/style.css">
</head>
<body>
  <main class="container py-5" style="max-width:520px;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="text-center mb-4" style="color: var(--color-primary)">استعادة كلمة المرور</h4>
        <div class="vstack gap-2">
          <label class="form-label">البريد الإلكتروني</label>
          <input id="email" type="email" class="form-control" placeholder="name@example.com">
          <button id="btn-send" class="btn btn-primary mt-2">إرسال رابط الاستعادة</button>
          <a href="/workspace/madayn-platform/pages/auth/login.html" class="btn btn-outline-secondary">عودة لتسجيل الدخول</a>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.all.min.js"></script>
  <script>
    document.getElementById('btn-send').addEventListener('click', ()=>{
      Swal.fire({ icon:'success', title:'تم إرسال التعليمات إلى بريدك (تجريبي)' });
    });
  </script>
</body>
</html>
