<div id="survey-form" class="card">
  <div class="card-body">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h5 id="survey-title" class="mb-0 text-primary-600"></h5>
      <div class="w-25">
        <div class="progress" role="progressbar" aria-label="Progress">
          <div id="survey-progress" class="progress-bar bg-success" style="width: 0%"></div>
        </div>
      </div>
    </div>
    <form id="survey-fields" class="vstack gap-3"></form>
    <div class="d-flex justify-content-between mt-3">
      <button class="btn btn-outline-secondary" id="btn-save" type="button">حفظ تلقائي</button>
      <div>
        <button class="btn btn-secondary" id="btn-prev" type="button">السابق</button>
        <button class="btn btn-primary" id="btn-next" type="button">التالي</button>
        <button class="btn btn-success d-none" id="btn-submit" type="button">إنهاء وإرسال</button>
      </div>
    </div>
  </div>
</div>
<div id="survey-rating" class="mt-3"></div>
